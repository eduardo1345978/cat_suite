# Builds every Cat Suite plug-in on Windows, runs the host tests, and publishes the
# "latest" release:
#   Cat-Suite-Windows.zip        all plug-ins (VST3) + Install-Cat-Suite.bat
#   Cat-Sound-Apps-Windows.zip   only the instruments that make sound, as standalone apps + VST3
#   Get-Cat-Sound-Apps.bat       downloads and installs Cat-Sound-Apps-Windows.zip
name: Build Windows plug-ins

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # "Run workflow" button on the Actions page

permissions:
  contents: write           # needed to publish the release

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false  # a running build always finishes (and publishes); newer pushes wait their turn

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Reuse the JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ hashFiles('cmake/JuceSetup.cmake') }}

      - name: Configure (VST3 + standalone apps for the sound plug-ins, with tests)
        run: cmake -B build -A x64 -DCAT_BUILD_TESTS=ON -DCAT_PLUGIN_FORMATS=VST3 -DCAT_SOUND_STANDALONE=ON -DCAT_COMMIT=${{ github.sha }}

      - name: Build all plug-ins, the sound apps and the test host
        run: cmake --build build --config Release --parallel --target CatSuiteHostTest PhaseCat_VST3 HumCat_VST3 GlitchCat_VST3 Molten_VST3 Swarm_VST3 Negative_VST3 SingCat_Standalone TalkCat_Standalone GlideCat_Standalone LifeCat_Standalone MuseCat_Standalone MuseCat_VST3 Negative_Standalone CatHub CatOcean CatBox CatSetup

      - name: Run the tests
        run: build\Tests\CatSuiteHostTest_artefacts\Release\CatSuiteHostTest.exe

      - name: Package
        shell: pwsh
        run: |
          # every failure shows up as an annotation on the run page (readable without the full log)
          trap { Write-Host "::error::$($_.Exception.Message)"; exit 1 }
          $pkg = "pkg\Cat-Suite"
          New-Item -ItemType Directory "$pkg\VST3" -Force | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match '_artefacts\\Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName "$pkg\VST3\" -Recurse; Write-Host "packed $($_.Name)" }
          Copy-Item packaging\Install-Cat-Suite.bat $pkg
          New-Item -ItemType Directory -Force "$pkg\MTS-ESP" | Out-Null
          Copy-Item ThirdParty\MTS-ESP\libMTS\Win\libMTSWin_v1.03.exe "$pkg\MTS-ESP\"
          Copy-Item ThirdParty\MTS-ESP\LICENSE "$pkg\MTS-ESP\LICENSE.txt"
          Copy-Item packaging\README-install.txt $pkg
          # Cat Suite's license and the third-party licenses go with every download
          Copy-Item LICENSE "$pkg\LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.txt $pkg
          Copy-Item licenses "$pkg\licenses" -Recurse
          Compress-Archive -Path "$pkg\*" -DestinationPath Cat-Suite-Windows.zip -Force
          $count = (Get-ChildItem "$pkg\VST3" -Directory).Count
          if ($count -lt 19) { throw "Only $count plug-ins were packed" }

          # Only the instruments that make sound: standalone apps + their VST3s
          $snd = "pkg\Cat-Sound-Apps"
          New-Item -ItemType Directory "$snd\Apps", "$snd\VST3" -Force | Out-Null
          foreach ($p in @("SingCat:Sing-Cat", "TalkCat:Talk-Cat", "GlideCat:Glide-Cat", "LifeCat:Life-Cat", "MuseCat:Muse-Cat", "Negative:Negative")) {
            $t, $n = $p.Split(":")
            Copy-Item "build\$t\${t}_artefacts\Release\Standalone\$n.exe" "$snd\Apps\"
            Copy-Item "$pkg\VST3\$n.vst3" "$snd\VST3\" -Recurse
            Write-Host "packed sound app $n"
          }
          # Cat Hub: the app + its own copies of the Cats it plays (same version, not seen by Cubase)
          Copy-Item "build\CatHub\CatHub_artefacts\Release\Cat-Hub.exe" "$snd\Apps\"
          New-Item -ItemType Directory "$snd\Hub Cats" -Force | Out-Null
          foreach ($n in @("Chord-Cat", "Bass-Cat", "Drum-Cat", "Life-Cat", "Patt-Cat", "Bend-Cat", "Orbit-Cat", "Glide-Cat", "Sing-Cat", "Talk-Cat")) {
            Copy-Item "$pkg\VST3\$n.vst3" "$snd\Hub Cats\" -Recurse
          }
          # Self test: the Hub plays a jam offline with these exact files; every Cat must be heard
          $t = Start-Process "$snd\Apps\Cat-Hub.exe" -ArgumentList '--selftest', "`"$((Resolve-Path "$snd\Hub Cats").Path)`"", "`"$PWD\hub-test.wav`"", '16' -Wait -PassThru
          Get-Content hub-test.txt
          if ($t.ExitCode -ne 0) {
            Get-Content hub-test.txt | Where-Object { $_ -notmatch '^ok ' } | Select-Object -First 30 | ForEach-Object { Write-Host "::error::hub self test: $_" }
            throw "Cat Hub self test failed (exit code $($t.ExitCode))"
          }
          # UI stress: the real window with the real Cat windows, random clicks while it plays
          $u = Start-Process "$snd\Apps\Cat-Hub.exe" -ArgumentList '--uistress', "`"$((Resolve-Path "$snd\Hub Cats").Path)`"", '90', '5' -PassThru
          $null = $u.Handle
          if (-not $u.WaitForExit(300000)) { $u.Kill(); throw "Cat Hub UI stress hung" }
          if ($u.ExitCode -ne 0) { throw "Cat Hub UI stress failed (exit code $($u.ExitCode))" }
          Write-Host "Cat Hub UI stress passed"
          # Cat Ocean: the endless YouTube ocean (its self test: chat commands, an hour of fish life, the music)
          Copy-Item "build\CatOcean\CatOcean_artefacts\Release\Cat-Ocean.exe" "$snd\Apps\"
          $o = Start-Process "$snd\Apps\Cat-Ocean.exe" -ArgumentList '--selftest', "`"$PWD\ocean-test`"" -PassThru
          $null = $o.Handle
          if (-not $o.WaitForExit(1200000)) { $o.Kill(); throw "Cat Ocean self test hung" }
          if (Test-Path ocean-test\ocean-test.txt) { Get-Content ocean-test\ocean-test.txt }
          if ($o.ExitCode -ne 0) {
            Get-Content ocean-test\ocean-test.txt | Where-Object { $_ -notmatch '^ok ' } | Select-Object -First 30 | ForEach-Object { Write-Host "::error::ocean self test: $_" }
            throw "Cat Ocean self test failed (exit code $($o.ExitCode))"
          }
          # Cat Box: the groovebox (Bubny / Arp / Bass), the same program that runs in the Raspberry Pi box
          Copy-Item "build\CatBox\CatBox_artefacts\Release\Cat-Box.exe" "$snd\Apps\"
          $b = Start-Process "$snd\Apps\Cat-Box.exe" -ArgumentList '--selftest', "`"$PWD\catbox-test.wav`"" -Wait -PassThru
          if (Test-Path catbox-test.txt) { Get-Content catbox-test.txt }
          if ($b.ExitCode -ne 0) { throw "Cat Box self test failed (exit code $($b.ExitCode))" }
          Copy-Item packaging\Install-Cat-Sound-Apps.bat $snd
          Copy-Item packaging\README-sound-apps.txt $snd
          Copy-Item packaging\Cat-Ocean-YouTube-Description.txt $snd
          Copy-Item LICENSE "$snd\LICENSE.txt"
          Copy-Item THIRD-PARTY-NOTICES.txt $snd
          Copy-Item licenses "$snd\licenses" -Recurse
          Compress-Archive -Path "$snd\*" -DestinationPath Cat-Sound-Apps-Windows.zip -Force
          if ((Get-ChildItem "$snd\Apps" -Filter *.exe).Count -ne 8) { throw "Sound apps missing" }
          Copy-Item packaging\Get-Cat-Sound-Apps.bat .
          # Cat Suite Setup: the installer / updater (its self test installs, updates and removes a fake release)
          Copy-Item "build\CatSetup\CatSetup_artefacts\Release\Cat-Suite-Setup.exe" .
          $st = Start-Process ".\Cat-Suite-Setup.exe" -ArgumentList '--selftest', "`"$PWD\setup-test`"" -Wait -PassThru
          if (Test-Path setup-test\setup-test.txt) { Get-Content setup-test\setup-test.txt }
          if ($st.ExitCode -ne 0) { throw "Cat Suite Setup self test failed (exit code $($st.ExitCode))" }

      - name: Keep the zip on the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: Cat-Suite-Windows
          path: |
            Cat-Suite-Windows.zip
            Cat-Sound-Apps-Windows.zip
            Get-Cat-Sound-Apps.bat
            Cat-Suite-Setup.exe
            hub-test.wav
            hub-test.txt
          retention-days: 30

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # never delete first: move the tag, then update the release in place (or create it), with retries
          $date = Get-Date -Format "yyyy-MM-dd HH:mm"
          $title = "Cat Suite - latest build ($date UTC)"
          $notes = "**Easiest (Windows): download Cat-Suite-Setup.exe and run it.** Tick the Cats and apps you want and press Install; later it shows what has an update and updates it with one click (it stays in the Start menu as Cat Suite Setup). If Windows warns about the file, click *More info* > *Run anyway*.<br><br>**Or by hand - everything (VST3 for Cubase):** download **Cat-Suite-Windows.zip** (all 16 Cats plus **Negative** (a photo you can hear, also as a program), the effects **Swarm** (the sound becomes a living cloud of grains) and **Molten** (melts any sound into something warm and fat), incl. **Glitch-Cat** (every note falls apart into bugs), **Hum-Cat** (sing a tune, get a song) and **Micro-Cat**), unzip it, close Cubase and double-click **Install-Cat-Suite.bat**. Then rescan in Cubase (Studio > VST Plug-in Manager).<br><br>**Mac (Apple Silicon and Intel, macOS 11+):** download **Cat-Suite-Mac.zip**, unzip it, quit Cubase, right-click **Install Cat Suite.command** > Open. Then rescan in Cubase.<br><br>**Only the instruments that make sound, as apps you can play with your computer keyboard** (Sing-Cat, Talk-Cat, Glide-Cat, Life-Cat, Muse-Cat the song writer, Cat Ocean the endless YouTube ocean, Cat Box the groovebox) **plus the Cat Hub** (every Cat jamming together in one window: Dice and Compose write whole songs or endless music, effects, Patt/Bend/Orbit-Cat as effects, Glide/Sing/Talk-Cat as sounds - press Play): download **Get-Cat-Sound-Apps.bat** and double-click it. It downloads and installs them (Start menu + Desktop shortcuts, plus the VST3 versions). If Windows warns about the file, click *More info* > *Run anyway*.<br><br>Built from commit ${{ github.sha }}."
          $files = @("Cat-Suite-Setup.exe", "Cat-Suite-Windows.zip", "Cat-Sound-Apps-Windows.zip", "Get-Cat-Sound-Apps.bat")
          git tag -f latest "${{ github.sha }}"
          git push -f origin refs/tags/latest
          $ok = $false
          for ($try = 1; $try -le 4 -and -not $ok; $try++) {
            gh release view latest *> $null
            if ($LASTEXITCODE -eq 0) {
              # the files first, then the notes (they name the commit): Setup never sees a new commit with old files
              gh release upload latest @files --clobber
              if ($LASTEXITCODE -eq 0) { gh release edit latest --title $title --notes $notes }
            } else {
              gh release create latest @files --verify-tag --title $title --notes $notes
            }
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Write-Host "publish try $try failed, waiting"; Start-Sleep -Seconds (15 * $try) }
          }
          if (-not $ok) { throw "Could not publish the release" }
          $global:LASTEXITCODE = 0
