# Builds every Cat Suite plug-in on Windows, runs the host tests, and publishes the
# "latest" release:
#   Cat-Suite-Windows.zip        all plug-ins (VST3) + Install-Cat-Suite.bat
#   Cat-Sound-Apps-Windows.zip   only the instruments that make sound, as standalone apps + VST3
#   Get-Cat-Sound-Apps.bat       downloads and installs Cat-Sound-Apps-Windows.zip
name: Build Windows plug-ins

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # "Run workflow" button on the Actions page

permissions:
  contents: write           # needed to publish the release

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true  # a newer push replaces a build that is still running

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Reuse the JUCE download
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ hashFiles('cmake/JuceSetup.cmake') }}

      - name: Configure (VST3 + standalone apps for the sound plug-ins, with tests)
        run: cmake -B build -A x64 -DCAT_BUILD_TESTS=ON -DCAT_PLUGIN_FORMATS=VST3 -DCAT_SOUND_STANDALONE=ON

      - name: Build all plug-ins, the sound apps and the test host
        run: cmake --build build --config Release --parallel --target CatSuiteHostTest SingCat_Standalone TalkCat_Standalone GlideCat_Standalone LifeCat_Standalone CatHub

      - name: Run the tests
        run: build\Tests\CatSuiteHostTest_artefacts\Release\CatSuiteHostTest.exe

      - name: Package
        shell: pwsh
        run: |
          $pkg = "pkg\Cat-Suite"
          New-Item -ItemType Directory "$pkg\VST3" -Force | Out-Null
          Get-ChildItem build -Recurse -Directory -Filter *.vst3 |
            Where-Object { $_.FullName -match '_artefacts\\Release\\VST3\\[^\\]+\.vst3$' } |
            ForEach-Object { Copy-Item $_.FullName "$pkg\VST3\" -Recurse; Write-Host "packed $($_.Name)" }
          Copy-Item packaging\Install-Cat-Suite.bat $pkg
          Copy-Item packaging\README-install.txt $pkg
          Compress-Archive -Path "$pkg\*" -DestinationPath Cat-Suite-Windows.zip -Force
          $count = (Get-ChildItem "$pkg\VST3" -Directory).Count
          if ($count -lt 10) { throw "Only $count plug-ins were packed" }

          # Only the instruments that make sound: standalone apps + their VST3s
          $snd = "pkg\Cat-Sound-Apps"
          New-Item -ItemType Directory "$snd\Apps", "$snd\VST3" -Force | Out-Null
          foreach ($p in @("SingCat:Sing-Cat", "TalkCat:Talk-Cat", "GlideCat:Glide-Cat", "LifeCat:Life-Cat")) {
            $t, $n = $p.Split(":")
            Copy-Item "build\$t\${t}_artefacts\Release\Standalone\$n.exe" "$snd\Apps\"
            Copy-Item "$pkg\VST3\$n.vst3" "$snd\VST3\" -Recurse
            Write-Host "packed sound app $n"
          }
          # Cat Hub: the app + its own copies of the Cats it plays (same version, not seen by Cubase)
          Copy-Item "build\CatHub\CatHub_artefacts\Release\Cat-Hub.exe" "$snd\Apps\"
          New-Item -ItemType Directory "$snd\Hub Cats" -Force | Out-Null
          foreach ($n in @("Chord-Cat", "Bass-Cat", "Drum-Cat", "Life-Cat", "Patt-Cat", "Bend-Cat", "Orbit-Cat", "Glide-Cat", "Sing-Cat", "Talk-Cat")) {
            Copy-Item "$pkg\VST3\$n.vst3" "$snd\Hub Cats\" -Recurse
          }
          # Self test: the Hub plays a jam offline with these exact files; every Cat must be heard
          $t = Start-Process "$snd\Apps\Cat-Hub.exe" -ArgumentList '--selftest', "`"$((Resolve-Path "$snd\Hub Cats").Path)`"", "`"$PWD\hub-test.wav`"", '16' -Wait -PassThru
          Get-Content hub-test.txt
          if ($t.ExitCode -ne 0) { throw "Cat Hub self test failed" }
          # UI stress: the real window with the real Cat windows, random clicks while it plays
          $u = Start-Process "$snd\Apps\Cat-Hub.exe" -ArgumentList '--uistress', "`"$((Resolve-Path "$snd\Hub Cats").Path)`"", '90', '5' -PassThru
          $null = $u.Handle
          if (-not $u.WaitForExit(300000)) { $u.Kill(); throw "Cat Hub UI stress hung" }
          if ($u.ExitCode -ne 0) { throw "Cat Hub UI stress failed (exit code $($u.ExitCode))" }
          Write-Host "Cat Hub UI stress passed"
          Copy-Item packaging\Install-Cat-Sound-Apps.bat $snd
          Copy-Item packaging\README-sound-apps.txt $snd
          Compress-Archive -Path "$snd\*" -DestinationPath Cat-Sound-Apps-Windows.zip -Force
          if ((Get-ChildItem "$snd\Apps" -Filter *.exe).Count -ne 5) { throw "Sound apps missing" }
          Copy-Item packaging\Get-Cat-Sound-Apps.bat .

      - name: Keep the zip on the Actions page
        uses: actions/upload-artifact@v4
        with:
          name: Cat-Suite-Windows
          path: |
            Cat-Suite-Windows.zip
            Cat-Sound-Apps-Windows.zip
            Get-Cat-Sound-Apps.bat
            hub-test.wav
            hub-test.txt
          retention-days: 30

      - name: Publish as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          $date = Get-Date -Format "yyyy-MM-dd HH:mm"
          gh release create latest Cat-Suite-Windows.zip Cat-Sound-Apps-Windows.zip Get-Cat-Sound-Apps.bat `
            --target "${{ github.sha }}" `
            --title "Cat Suite - latest build ($date UTC)" `
            --notes "**Everything (VST3 for Cubase):** download **Cat-Suite-Windows.zip**, unzip it, close Cubase and double-click **Install-Cat-Suite.bat**. Then rescan in Cubase (Studio > VST Plug-in Manager).<br><br>**Only the instruments that make sound, as apps you can play with your computer keyboard** (Sing-Cat, Talk-Cat, Glide-Cat, Life-Cat) **plus the Cat Hub** (every Cat jamming together in one window: styles, dice, effects, Patt/Bend/Orbit-Cat as effects, Glide/Sing/Talk-Cat as sounds - press Play): download **Get-Cat-Sound-Apps.bat** and double-click it. It downloads and installs them (Start menu + Desktop shortcuts, plus the VST3 versions). If Windows warns about the file, click *More info* > *Run anyway*.<br><br>Built from commit ${{ github.sha }}."
